<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caccer Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a dealer's back office, plain and exact, numbers first, written for Santi.
   IDEA: the deal jacket: every car has its folder with cost, repairs, sale and tax.
   PICTURE: the profit of the year as the headline, the tax owed this quarter as the one red block.
   COLOUR and TYPE: white ledger, graphite ink, Caccer red only for money owed and alerts; Archivo for figures, Archivo Narrow for labels.
   LAYOUT: tabs on top (bottom bar on phones), figure-first panel, car cards, tables with downloads. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1012);--soft:light-dark(#f4f4f2,#17191c);--ink:light-dark(#141518,#f2f2f0);
--mute:light-dark(#5d6168,#a3a7ad);--line:light-dark(#e2e2de,#2b2e33);--red:#d9231a;--green:light-dark(#127a45,#4cc38a);--amber:light-dark(#9a5b00,#f0b450)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:#0b0c0e;color:#f2f2f0}
header .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px;display:flex;align-items:center;gap:10px}
.logo i{width:24px;height:12px;background:var(--red);transform:skewX(-20deg)}
.logo small{font:600 13px 'Archivo Narrow';color:#a3a7ad}
.sync{margin-left:auto;font:600 13px 'Archivo Narrow';color:#a3a7ad}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-weight:700;color:var(--mute);min-height:48px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--red)}
.tabs b{font:700 12px 'Archivo Narrow';background:var(--soft);border-radius:999px;padding:1px 7px;margin-left:4px}
main{padding:24px 0 70px}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.05;margin:0 0 6px;font-weight:900;text-wrap:balance}
h2{font-size:22px;margin:32px 0 12px;font-weight:800}
.sub{color:var(--mute);margin:0 0 20px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px}
.owed{background:var(--soft);border-radius:16px;padding:22px;border-left:8px solid var(--red)}
.owed .lbl{font:700 14px 'Archivo Narrow';color:var(--mute)}
.big{font-size:clamp(42px,6vw,68px);font-weight:900;line-height:1;letter-spacing:-.02em;margin:8px 0;white-space:nowrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kpis div{background:var(--bg);padding:14px 18px}
.kpis b{display:block;font-size:26px;font-weight:800;white-space:nowrap}
.kpis span{font:600 13px 'Archivo Narrow';color:var(--mute)}
.pos{color:var(--green)}.neg{color:var(--red)}
.alerts{display:grid;gap:8px;margin-top:18px}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 14px}
.alert.red{border-left-color:var(--red)}
.banner{background:light-dark(#f3efff,#1e1933);border:1px solid light-dark(#d9cffb,#3d3266);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.bar .t i{display:block;height:12px;border-radius:3px;background:var(--ink);min-width:2px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;white-space:nowrap}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.card h3{margin:0;font-size:18px;line-height:1.2}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;min-height:20px}
.card dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:15px}
.card dt{color:var(--mute)}.card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font:700 12px 'Archivo Narrow';padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tag.warn{background:light-dark(#fff3dc,#2c2210);border-color:transparent;color:var(--amber)}
.tag.ex{background:light-dark(#efeaff,#241d3d);border-color:transparent;color:light-dark(#5a3fc0,#b9a6ff)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:700 13px 'Archivo Narrow';color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--ink)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--ink)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.quarters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:4px;align-content:start}
.q h3{margin:0;font-size:18px}.q .due{font:600 13px 'Archivo Narrow';color:var(--mute)}
.q dl{margin:8px 0 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.q dt{color:var(--mute)}.q dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .pay{border-top:2px solid var(--ink);padding-top:8px;margin:6px 0;display:flex;justify-content:space-between;font-weight:800}
.q.now{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.annual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.annual section{border:1px solid var(--line);border-radius:14px;padding:16px}
.annual h3{margin:0 0 8px;font-size:18px}
.annual dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;font-size:15px}
.annual dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.annual .tot{border-top:2px solid var(--ink);padding-top:6px;font-weight:800}
.dlbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.dlbox>div{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start}
.dlbox b{font-size:17px}.dlbox p{margin:0;color:var(--mute);font-size:14px}
.note{font-size:14px;color:var(--mute);background:var(--soft);border-radius:12px;padding:14px 16px;margin-top:18px}
.note b{color:var(--ink)}
label{display:grid;gap:5px;font:600 14px 'Archivo Narrow';color:var(--mute)}
input,select,textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;width:100%}
textarea{min-height:70px;padding:10px 12px}
.search{width:280px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:20;padding:16px}
.dlg.open{display:grid}
.dlg form{background:var(--bg);border-radius:16px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.dlg h3{margin:0 0 4px;font-size:22px}
.dlg .hint{margin:0 0 14px;color:var(--mute);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
.sec{grid-column:1/-1;font:800 15px Archivo;color:var(--ink);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.calcline{grid-column:1/-1;background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#141518;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
pre{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;font-size:13px;max-height:320px;overflow:auto}
.scroll{overflow-x:auto}
@media(max-width:900px){.hero,.annual{grid-template-columns:1fr}.quarters{grid-template-columns:1fr 1fr}.dlbox{grid-template-columns:1fr}}
@media(max-width:600px){
 .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;justify-content:space-around;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:15}
 .tabs button{padding:10px 6px;font-size:13px;border-bottom:0;border-top:3px solid transparent}.tabs button[aria-selected=true]{border-top-color:var(--red)}.tabs b{display:none}
 main{padding-bottom:110px}.quarters,.grid2{grid-template-columns:1fr}.kpis b{font-size:22px}.search{width:100%}
 table{font-size:14px}.stack thead{display:none}.stack tfoot td{display:block;text-align:start}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font:600 13px 'Archivo Narrow';color:var(--mute)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack tbody td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header><div class="wrap"><div class="logo"><i></i>CACCER <small>Admin de Santi</small></div><div class="sync" id="sync">Conectando…</div></div></header>
<div class="wrap"><nav class="tabs" role="tablist" id="tabs">
 <button role="tab" data-t="panel" aria-selected="true">Panel</button>
 <button role="tab" data-t="inventario" aria-selected="false">Inventario<b id="cInv"></b></button>
 <button role="tab" data-t="vendidos" aria-selected="false">Vendidos<b id="cSold"></b></button>
 <button role="tab" data-t="gastos" aria-selected="false">Gastos</button>
 <button role="tab" data-t="taxes" aria-selected="false">Impuestos</button>
</nav></div>
<main class="wrap" id="view"></main>
<div class="dlg" id="dlg"><form id="frm" novalidate></form></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const money=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const m2=n=>money(n,2);
const num=v=>{const x=parseFloat(String(v??'').replace(/[$,]/g,''));return isFinite(x)?x:0;};
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const qOf=d=>d?Math.floor((+d.slice(5,7)-1)/3)+1:0;
const yOf=d=>d?+d.slice(0,4):0;
const fmtDate=d=>{if(!d)return '';const [y,m,dd]=d.split('-');return `${+dd} ${MES[+m-1].toLowerCase()} ${y}`;};
const days=(a,b)=>a?Math.max(0,Math.round(((b?new Date(b):new Date())-new Date(a))/864e5)):null;
const toast=t=>{$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),2400);};
const carName=a=>[a.year,a.make,a.model].filter(Boolean).join(' ');

/* ---------- data ---------- */
const S={autos:[],gastos:[],settings:{salesRate:7.45,docFee:299,titleFees:180}};
let db=null,tab='panel',year=new Date().getFullYear(),q='',gq=0;
const LS='caccer-admin-v2';
const EXAMPLES={autos:[
 {id:'ej-fit2012',ejemplo:true,year:'2012',make:'Honda',model:'Fit Sport',status:'vendido',miles:'77000',buyDate:'2026-09-02',source:'Subasta (ejemplo)',cost:'7200',recon:'650',listPrice:'10900',saleDate:'2026-10-30',salePrice:'9677.73',docFee:'299',taxRate:'7.45',salesTax:'743.27',titleFees:'180',buyer:'Cliente de ejemplo A',payment:'Contado',notes:'Ejemplo: así se ve un auto vendido.'},
 {id:'ej-x62014',ejemplo:true,year:'2014',make:'BMW',model:'X6 xDrive35i',status:'vendido',miles:'36000',buyDate:'2026-08-18',source:'Particular (ejemplo)',cost:'12800',recon:'900',listPrice:'17900',saleDate:'2026-10-26',salePrice:'16192.39',docFee:'299',taxRate:'7.45',salesTax:'1228.61',titleFees:'180',buyer:'Cliente de ejemplo B',payment:'Financiado',notes:'Ejemplo: vendido con financiamiento.'}],
 gastos:[
 {id:'ej-g1',ejemplo:true,date:'2026-09-05',autoId:'ej-fit2012',cat:'Reparación y partes',amount:'320',vendor:'Taller de ejemplo',note:'Frenos delanteros'},
 {id:'ej-g2',ejemplo:true,date:'2026-09-08',autoId:'ej-fit2012',cat:'Detallado y limpieza',amount:'150',note:'Detallado completo'},
 {id:'ej-g3',ejemplo:true,date:'2026-08-20',autoId:'ej-x62014',cat:'Subasta y transporte',amount:'275',note:'Grúa desde la subasta'},
 {id:'ej-g4',ejemplo:true,date:'2026-10-01',autoId:'',cat:'Publicidad',amount:'120',note:'Promoción en Instagram'}]};
const SEED=[['trx2021','2021','Ram','1500 TRX 4x4','154000','42900'],['velar2018','2018','Land Rover','Range Rover Velar P250 R-Dynamic','88000','15900'],['rav42017','2017','Toyota','RAV4 LE AWD','145000','13900'],['crv2008','2008','Honda','CR-V EX AWD','69000','13900'],['f1502013','2013','Ford','F-150 XLT 4x4 Long Bed','142000','14900']]
 .map(([id,year,make,model,miles,listPrice])=>({id,year,make,model,miles,listPrice,status:'disponible',notes:'Completar costo y fecha de compra.'}));
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function lsLoad(){try{const x=JSON.parse(localStorage.getItem(LS));if(x){Object.assign(S,x);return true;}}catch(e){}return false;}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function save(coll,obj,quiet){if(!obj.id)obj.id=newId();const {id,...body}=obj;
 if(db){try{await db.collection(coll).doc(id).set(body);}catch(e){toast(e.code==='invalid_argument'?'No tenés permiso para guardar':'No se pudo guardar, probá de nuevo');return false;}}
 const arr=S[coll],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=obj;else arr.push(obj);if(!db)lsSave();draw();if(!quiet)toast('Guardado');return true;}
async function del(coll,id,quiet){if(db){try{await db.collection(coll).doc(id).delete();}catch(e){toast('No se pudo borrar');return;}}
 S[coll]=S[coll].filter(x=>x.id!==id);if(!db)lsSave();draw();if(!quiet)toast('Borrado');}
async function saveSettings(){if(db){try{await db.doc('settings/main').set(S.settings);}catch(e){}}else lsSave();}

/* ---------- calculations ---------- */
const carExp=a=>S.gastos.filter(g=>g.autoId===a.id).reduce((s,g)=>s+num(g.amount),0);
const carCost=a=>num(a.cost)+num(a.recon)+carExp(a);
const taxable=a=>num(a.salePrice)+num(a.docFee);
const profit=a=>a.status==='vendido'?taxable(a)-carCost(a):0;
const rate=a=>num(a.taxRate||S.settings.salesRate)/100;
const preTax=(otd,a)=>(num(otd)-num(a.titleFees))/(1+rate(a))-num(a.docFee);
const estMargin=a=>{if(!a.listPrice)return null;const b={...a,docFee:a.docFee||S.settings.docFee,titleFees:a.titleFees||S.settings.titleFees};return preTax(a.listPrice,b)+num(b.docFee)-carCost(a);};
const sold=()=>S.autos.filter(a=>a.status==='vendido');
const avail=()=>S.autos.filter(a=>a.status!=='vendido');
function quarter(y,n){const list=sold().filter(a=>yOf(a.saleDate)===y&&qOf(a.saleDate)===n);
 const due=n===4?`${y+1}-01-31`:`${y}-${['04-30','07-31','10-31'][n-1]}`;
 return {list,due,sales:list.reduce((s,a)=>s+taxable(a),0),tax:list.reduce((s,a)=>s+num(a.salesTax),0),profit:list.reduce((s,a)=>s+profit(a),0),
  exp:S.gastos.filter(g=>yOf(g.date)===y&&qOf(g.date)===n).reduce((s,g)=>s+num(g.amount),0)};}
function annual(y){const list=sold().filter(a=>yOf(a.saleDate)===y);
 const ventas=list.reduce((s,a)=>s+taxable(a),0),compra=list.reduce((s,a)=>s+num(a.cost),0),recon=list.reduce((s,a)=>s+num(a.recon)+carExp(a),0);
 const general=S.gastos.filter(g=>yOf(g.date)===y&&!g.autoId).reduce((s,g)=>s+num(g.amount),0);
 const ds=list.map(a=>days(a.buyDate,a.saleDate)).filter(x=>x!=null);
 return {list,ventas,compra,recon,bruta:ventas-compra-recon,general,neto:ventas-compra-recon-general,
  inv:avail().filter(a=>!a.buyDate||yOf(a.buyDate)<=y).reduce((s,a)=>s+carCost(a),0),tax:list.reduce((s,a)=>s+num(a.salesTax),0),
  avgProfit:list.length?(ventas-compra-recon)/list.length:0,avgDays:ds.length?Math.round(ds.reduce((a,b)=>a+b,0)/ds.length):null,qs:[1,2,3,4].map(n=>quarter(y,n))};}

/* ---------- forms ---------- */
const CATS=['Reparación y partes','Detallado y limpieza','Subasta y transporte','Inspección y emisiones','Título y DMV','Publicidad','Seguro','Licencia de dealer','Renta del lote','Teléfono y software','Comisiones bancarias','Otro'];
const F={
 auto:{hint:'Datos de compra y precio publicado. La venta se carga con "Marcar vendido".',fields:[
  ['year','Año','number'],['make','Marca'],['model','Modelo y versión','text','full'],['vin','VIN (opcional)'],['miles','Millas','number'],
  ['buyDate','Fecha de compra','date'],['source','Dónde lo compraste'],['cost','Costo de compra $','money'],['recon','Reparaciones iniciales $','money'],
  ['listPrice','Precio publicado OTD $','money'],['status','Estado','select',['disponible','vendido']],['notes','Notas','area','full']],
  calc:a=>{const m=estMargin(a);return `<span>Costo total ${money(carCost(a))}</span>${m!=null&&num(a.cost)?`<span>Ganancia aprox. a ese precio: <span class="${m<0?'neg':'pos'}">${money(m)}</span></span>`:''}`;}},
 venta:{hint:'Si cerraste un precio final (OTD), escribilo arriba y la app separa precio, doc fee, sales tax y DMV.',fields:[
  ['__sec','Calcular desde el precio final'],['otd','Precio final OTD que pagó el cliente $','money','full'],
  ['__sec','Detalle de la venta'],['saleDate','Fecha de venta','date'],['buyer','Comprador'],['salePrice','Precio del auto (sin tax) $','money'],['docFee','Doc fee $','money'],
  ['taxRate','Tasa sales tax %','money'],['salesTax','Sales tax cobrado $','money'],['titleFees','Título y registración DMV $','money'],['payment','Forma de pago','select',['Contado','Financiado','Trade-in + contado','Trade-in + financiado']],
  ['tradeIn','Valor del trade-in $','money'],['notes','Notas','area','full']],
  calc:a=>{const t=r2(taxable(a)*rate(a)),g=taxable(a)-carCost(a);return `<span>Tax sugerido ${m2(t)}</span><span>Total OTD ${m2(taxable(a)+num(a.salesTax||t)+num(a.titleFees))}</span><span>Ganancia <span class="${g<0?'neg':'pos'}">${money(g)}</span></span>`;}},

function xlsxGastos(){if(!ready(window.XLSX))return;const wb=XLSX.utils.book_new();addGastosSheet(wb,gastosList());outX(wb,`caccer-gastos-${year}${gq?'-T'+gq:''}.xlsx`);}
function pdfDoc(title,subtitle){const d=new window.jspdf.jsPDF({unit:'pt',format:'letter'});
 d.setFillColor(217,35,26);d.rect(40,36,26,10,'F');d.setFont('helvetica','bold');d.setFontSize(11);d.text('CACCER MOTORSPORTS',74,45);
 d.setFontSize(20);d.text(title,40,80);d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(100);d.text(subtitle+'  |  '+stamp(),40,98);d.setTextColor(20);return d;}
const tbl=(d,head,body,y,opts={})=>{d.autoTable({head:[head],body,startY:y,styles:{fontSize:8.5,cellPadding:4},headStyles:{fillColor:[20,21,24]},margin:{left:40,right:40},...opts});return d.lastAutoTable.finalY+22;};
const sec=(d,t,y)=>{if(y>700){d.addPage();y=50;}d.setFont('helvetica','bold');d.setFontSize(13);d.text(t,40,y);d.setFont('helvetica','normal');return y+8;};
const right={columnStyles:{1:{halign:'right'}}};
function footer(d){const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(120);d.text('Resumen para revisar con el contador. No reemplaza su consejo.',40,770);d.text(`${i}/${n}`,572,770,{align:'right'});}}
function pdfAll(){if(!ready(window.jspdf))return;const A=annual(year),d=pdfDoc('Impuestos '+year,'Sales tax y resumen anual');
 let y=tbl(d,['Trimestre','Vence','Autos','Ventas gravables','Sales tax a pagar','Ganancia','Gastos'],A.qs.map((x,i)=>['T'+(i+1),fmtDate(x.due),x.list.length,m2(x.sales),m2(x.tax),m2(x.profit),m2(x.exp)]),116);
 y=tbl(d,['Resumen del año','Monto'],[['Ventas (precio + doc fee)',m2(A.ventas)],['Costo de compra de vendidos',m2(-A.compra)],['Reparaciones y gastos de vendidos',m2(-A.recon)],['Ganancia bruta',m2(A.bruta)],['Gastos generales',m2(-A.general)],['Ganancia neta',m2(A.neto)],['Sales tax cobrado (no es ingreso)',m2(A.tax)],['Inventario sin vender, al costo',m2(A.inv)]],y,right);
 y=tbl(d,['Fecha','Auto','Comprador','Gravable','Sales tax','Costo total','Ganancia'],A.list.map(a=>[a.saleDate,carName(a)+(a.ejemplo?' (ejemplo)':''),a.buyer||'',m2(taxable(a)),m2(a.salesTax),m2(carCost(a)),m2(profit(a))]),sec(d,'Ventas',y));
 const gl=S.gastos.filter(g=>yOf(g.date)===year).sort((a,b)=>a.date.localeCompare(b.date));
 tbl(d,gastosHead,[...gastosRows(gl).map(r=>[...r.slice(0,5),m2(r[5])]),['','','','','Total',m2(gl.reduce((s,g)=>s+num(g.amount),0))]],sec(d,'Gastos',y));
 footer(d);saveFile(`caccer-impuestos-${year}.pdf`,d.output('blob'));}
function pdfQuarter(n){if(!ready(window.jspdf))return;const x=quarter(year,n),d=pdfDoc(`Sales tax T${n} ${year}`,`Vence ${fmtDate(x.due)}  |  TC-62S en tap.utah.gov`);
 const y=tbl(d,['Concepto','Monto'],[['Autos vendidos',String(x.list.length)],['Ventas gravables (precio + doc fee)',m2(x.sales)],['Sales tax a pagar',m2(x.tax)],['Ganancia del trimestre',m2(x.profit)],['Gastos del trimestre',m2(x.exp)]],116,right);
 tbl(d,['Fecha','Auto','Comprador','Precio','Doc fee','Tasa','Sales tax'],x.list.map(a=>[a.saleDate,carName(a)+(a.ejemplo?' (ejemplo)':''),a.buyer||'',m2(a.salePrice),m2(a.docFee),(a.taxRate||S.settings.salesRate)+'%',m2(a.salesTax)]),sec(d,'Ventas del trimestre',y));
 footer(d);saveFile(`caccer-sales-tax-${year}-T${n}.pdf`,d.output('blob'));}
function pdfGastos(){if(!ready(window.jspdf))return;const list=[...gastosList()].sort((a,b)=>a.date.localeCompare(b.date)),by={};list.forEach(g=>by[g.cat]=(by[g.cat]||0)+num(g.amount));
 const d=pdfDoc('Gastos '+year+(gq?' T'+gq:''),list.length+' gastos');
 const y=tbl(d,['Categoría','Total'],Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,m2(v)]),116,right);
 tbl(d,gastosHead,[...gastosRows(list).map(r=>[...r.slice(0,5),m2(r[5])]),['','','','','Total',m2(list.reduce((s,g)=>s+num(g.amount),0))]],sec(d,'Detalle',y));
 footer(d);saveFile(`caccer-gastos-${year}${gq?'-T'+gq:''}.pdf`,d.output('blob'));}
function qText(n){const x=quarter(year,n);return `CACCER MOTORSPORTS · Sales tax ${year} T${n} (vence ${fmtDate(x.due)})\nAutos vendidos: ${x.list.length}\nVentas gravables: ${m2(x.sales)}\nSales tax a pagar (TC-62S): ${m2(x.tax)}\n`+x.list.map(a=>`- ${a.saleDate} ${carName(a)}: ${m2(taxable(a))}, tax ${m2(a.salesTax)}`).join('\n');}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copiado');}catch(e){editing={kind:'copy',obj:{}};$('frm').innerHTML=`<h3>Copiá este texto</h3><pre>${esc(t)}</pre><button class="btn" type="button" id="cancel">Cerrar</button>`;$('dlg').classList.add('open');$('cancel').onclick=closeForm;}}

/* ---------- wiring ---------- */
function draw(){$('cInv').textContent=avail().length;$('cSold').textContent=sold().length;
 const keep=document.activeElement?.id==='q';$('view').innerHTML=({panel,inventario,vendidos,gastos,taxes})[tab]();
 if(keep){const i=$('q');i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
function go(t){tab=t;[...$('tabs').children].forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));draw();scrollTo(0,0);}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t);};
const byId=id=>S.autos.find(a=>a.id===id);
$('view').addEventListener('click',async e=>{const t=e.target.closest('button,tr.click');if(!t)return;const ds=t.dataset;
 if(ds.edit)return openForm('auto',byId(ds.edit));
 if(ds.sell)return openForm('venta',sellDefaults(byId(ds.sell)));
 if(ds.addexp)return openForm('gasto',{date:today(),autoId:ds.addexp,cat:'Reparación y partes'});
 if(ds.g)return openForm('gasto',S.gastos.find(g=>g.id===ds.g));
 if(ds.new==='auto')return openForm('auto',{status:'disponible',buyDate:today()});
 if(ds.new==='gasto')return openForm('gasto',{date:today(),cat:'Reparación y partes'});
 if(ds.copyq)return copy(qText(+ds.copyq));
 const dl={xlsx:xlsxAll,pdf:pdfAll,gx:xlsxGastos,gp:pdfGastos}[ds.dl];if(dl)return dl();if(ds.dl==='pdf-q')return pdfQuarter(+ds.q);
 if(t.id==='delEx'){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Tocá otra vez para borrar';t.classList.add('red');return;}
  for(const g of S.gastos.filter(g=>g.ejemplo))await del('gastos',g.id,true);for(const a of S.autos.filter(a=>a.ejemplo))await del('autos',a.id,true);toast('Ejemplos borrados');}
});
$('view').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;draw();}});
$('view').addEventListener('change',e=>{const id=e.target.id,v=num(e.target.value);if(id==='yearSel'){year=+e.target.value;draw();}if(id==='gq'){gq=+e.target.value;draw();}
 if(id==='setSales'){S.settings.salesRate=v;saveSettings();toast('Tasa guardada');draw();}
 if(id==='setDoc'){S.settings.docFee=v;saveSettings();toast('Doc fee guardado');}
 if(id==='setTitle'){S.settings.titleFees=v;saveSettings();toast('DMV guardado');}});

/* ---------- boot ---------- */
draw();
(async()=>{const timer=setTimeout(()=>{$('sync').textContent='Sin conexión: los datos pueden estar viejos';},10000);
 db=await (window.claude?.use?.('db')??Promise.resolve(null)).catch(()=>null);
 if(!db){clearTimeout(timer);if(!lsLoad()){S.autos=[...SEED,...EXAMPLES.autos].map(x=>({...x}));S.gastos=EXAMPLES.gastos.map(x=>({...x}));lsSave();}
  $('sync').textContent='Guardado en este navegador';draw();return;}
 const got=new Set();
 for(const c of ['autos','gastos'])db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));
  if(!s.metadata.fromCache){got.add(c);if(got.size===2){clearTimeout(timer);$('sync').textContent='Guardado en la nube';}}if(!editing)draw();},
  err=>{clearTimeout(timer);$('sync').textContent=err.code==='revoked'?'Sin acceso':'No se pudo conectar';});
 db.doc('settings/main').onSnapshot(s=>{if(s.exists)Object.assign(S.settings,s.data());if(!editing)draw();},()=>{});
})();
}
</script>
